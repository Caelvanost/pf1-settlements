name: Bootstrap PF1 Settlements release

on:
  push:
    branches:
      - main
    paths:
      - ".bootstrap/**"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand module source
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE=".bootstrap/pf1-settlements-v2.6.0.zip"
          cp "$ARCHIVE" /tmp/pf1-settlements-v2.6.0.zip
          mkdir -p /tmp/pf1-settlements-src
          unzip -q -o "$ARCHIVE" -d /tmp/pf1-settlements-src
          rsync -a --delete --exclude '.git/' --exclude '.github/' --exclude '.bootstrap/' /tmp/pf1-settlements-src/ ./
          rm -rf .bootstrap

      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish PF1 Settlements v2.6.0"
            git push origin HEAD:main
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v2.6.0"
          ASSET="/tmp/pf1-settlements-v2.6.0.zip"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --target main \
              --title "PF1 Settlements v2.6.0" \
              --notes "PF1 Settlements v2.6.0 — gestion avancée des villes et communautés pour Foundry VTT v13 avec le système Pathfinder 1."
          fi
